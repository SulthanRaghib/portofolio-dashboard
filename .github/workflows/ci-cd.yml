# .github/workflows/ci-cd.yml
name: CI / CD (Vercel)

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || '' }}

jobs:
  # 1) Lint, Type-check, & Test
  lint-build-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # FIX: Menggunakan eslint langsung untuk menghindari crash pada Next.js v16 CLI
      - name: Run ESLint
        run: npx eslint .

      - name: Type check (TypeScript)
        run: npm run type-check --if-present

      - name: Run tests
        run: npm run test --if-present

  # 2) Deploy Preview (untuk Pull Request & Branch selain master)
  deploy-preview:
    name: Deploy Preview to Vercel
    needs: lint-build-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: vercel_preview
        run: |
          # Deploy preview dan ambil URL-nya
          DEPLOY_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -Eo 'https://[^ ]+\.vercel\.app')
          echo "PREVIEW_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview link
        if: ${{ github.event_name == 'pull_request' && steps.vercel_preview.outputs.PREVIEW_URL }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel_preview.outputs.PREVIEW_URL }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview deployment ready: ${url}`
            });

  # 3) Deploy Production (Khusus branch master)
  deploy-production:
    name: Deploy Production to Vercel
    needs: lint-build-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
